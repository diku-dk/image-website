name: update-publications

on:
    schedule:
        - cron: "0 0 1 * *"
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - "env"

jobs:
    update-publications:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v5

            - name: Fetch publications from Google Scholar
              env:
                  SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
              run: |
                  python3 -m pip install pyyaml --quiet
                  python3 .github/scripts/fetch_publications.py

            - name: Merge scraped publications into the existing list
              run: python3 .github/scripts/merge_publications.py

            - name: Enrich truncated author lists
              env:
                  SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
              run: python3 .github/scripts/enrich_authors.py

            - name: Configure Git
              run: |
                  git config --global user.name "GitHub Actions"
                  git config --global user.email "actions@github.com"

            - name: Commit changes
              id: commit
              run: |
                  git add docs/_data/publications.yml
                  if git diff --cached --quiet; then
                      echo "No publication changes to commit."
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                  else
                      git commit -m "Update publications.yml"
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Push changes
              if: steps.commit.outputs.changed == 'true'
              run: git push
