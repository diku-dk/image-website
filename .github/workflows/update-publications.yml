name: update-publications

on:
    schedule:
        - cron: "0 0 1 * *"
    workflow_dispatch:
    push:
        paths:
            - "env"
    pull_request:
        paths:
            - "env"

jobs:
    update-publications:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v2

            - name: Run Docker image and update file
              run: |
                  docker run --env-file env --rm dascalutudor/scholar-scraper:latest > updated-publications.yml

            - name: Merge scraped publications into the existing list
              run: |
                  python3 -m pip install pyyaml --quiet
                  python3 .github/scripts/merge_publications.py

            - name: Configure Git
              run: |
                  git config --global user.name "GitHub Actions"
                  git config --global user.email "actions@github.com"

            - name: Commit changes
              run: |
                  git add docs/_data/publications.yml
                  git commit -m "Update publications.yml"

            - name: Push changes
              uses: ad-m/github-push-action@v0.6.0
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  branch: "main"
